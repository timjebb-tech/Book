<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Book.js" defer></script>
</head>
<body>
    <button id="addBookDlgButton">Add Book</button>

    <div id="myContainer"></div>


    <dialog id="addBookDialog">
        <form>
            <h2>Add Book</h2>
            <p>Please enter the details of your book:</p>
            <p>
                <label>
                    Book Name <input type="text" id="bookName">
                </label>
            </p>
            <p>
                <label>Author <input type="text" id="author"></label>
            </p>
            <p>
                <label>Number of pages<input type="text" id="pages"></label>
            </p>
            
            <p>
                <label>Already read?<input type="checkbox" id="read"></label>
            </p>
            
            <button id="addBookButton">Add Book</button>
            <button id="cancelButton">Cancel</button>
        </form>
    </dialog>
</body>
</html>
